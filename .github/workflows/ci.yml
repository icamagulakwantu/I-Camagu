name: CI

# Runs the automated test suite and a production build on every push and
# pull request against main — the tests added this session (reference
# generation, PayFast signatures, SmartMatch tiers, the PSP refund-gating
# logic) previously existed but nothing enforced them. This closes that gap:
# a broken money-critical change now fails loudly here instead of only
# being caught by someone reading Render's logs after it's already live.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Audit dependency advisories (report-only)
        id: dependency_audit
        continue-on-error: true
        run: |
          set +e
          yarn audit --json > dependency-audit.json 2>&1
          audit_exit_code=$?
          set -e
          echo "audit_exit_code=$audit_exit_code" >> "$GITHUB_OUTPUT"
          test -f dependency-audit.json || touch dependency-audit.json

      - name: Summarize dependency advisory audit
        if: always()
        env:
          AUDIT_EXIT_CODE: ${{ steps.dependency_audit.outputs.audit_exit_code }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const lines = fs.readFileSync('dependency-audit.json', 'utf8').split(/\r?\n/).filter(Boolean);
          const events = [];
          const parseErrors = [];
          for (const line of lines) {
            try { events.push(JSON.parse(line)); }
            catch { parseErrors.push(line.slice(0, 300)); }
          }
          const advisories = events.filter((event) => event.type === 'auditAdvisory').map((event) => event.data?.advisory).filter(Boolean);
          const unique = [...new Map(advisories.map((advisory) => [String(advisory.id), advisory])).values()];
          const summary = events.find((event) => event.type === 'auditSummary')?.data;
          const total = summary?.vulnerabilities || {};
          const severities = ['critical', 'high', 'moderate', 'low', 'info'];
          const completed = Boolean(summary);
          const report = [
            '## Dependency advisory audit (report-only)',
            '',
            completed
              ? 'Yarn completed the registry audit. This step reports advisories but does not automatically upgrade dependencies or block the release.'
              : 'The audit did not produce a final summary. Treat this result as **incomplete**, not as a clean dependency audit.',
            '',
            `Audit command exit code: ${process.env.AUDIT_EXIT_CODE || 'unknown'}`,
            '',
            '| Severity | Count |',
            '|---|---:|',
            ...severities.map((severity) => `| ${severity} | ${Number(total[severity] || 0)} |`),
            '',
            `Unique advisories returned: ${unique.length}`,
            '',
            ...unique.slice(0, 50).map((advisory) => `- **${String(advisory.severity || 'unknown').toUpperCase()}** ${advisory.module_name || 'unknown package'} — ${advisory.title || 'Untitled advisory'} (patched: ${advisory.patched_versions || 'no patched version listed'}) ${advisory.url || ''}`),
            ...(unique.length > 50 ? [`- ${unique.length - 50} additional advisories are retained in the downloadable artifact.`] : []),
            ...(parseErrors.length ? ['', `Unparsed audit output lines: ${parseErrors.length}; inspect the artifact to determine whether the registry or command failed.`] : []),
          ];
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, report.join('\n') + '\n');
          console.log(report.join('\n'));
          NODE

      - name: Upload dependency advisory audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: icamagu-dependency-audit
          path: dependency-audit.json
          if-no-files-found: warn
          retention-days: 14

      - name: Reject hosted-editor runtime targets
        run: yarn check:runtime-targets

      - name: Generate Prisma client
        run: yarn prisma:generate

      - name: Run test suite
        run: yarn test

      - name: Build frontend
        run: yarn build

  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: icamagu_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d icamagu_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/icamagu_test?schema=public
      RUN_POSTGRES_INTEGRATION: 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Generate Prisma client
        run: yarn prisma:generate

      # Disposable CI database only. This validates the current schema against
      # real PostgreSQL; it does not replace the required reviewed migration
      # baseline for staging or production.
      - name: Create disposable PostgreSQL schema
        run: yarn prisma db push --schema=prisma/schema.prisma

      - name: Run real PostgreSQL financial integrity tests
        run: yarn vitest run --no-file-parallelism server/services/ledgerService.integration.test.js server/controllers/stokvelFinanceController.integration.test.js server/controllers/stokvelPoolFundingController.integration.test.js server/controllers/contributionExpense.integration.test.js server/services/matchmakerService.pool-lock.integration.test.js

  migration-baseline-validation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: icamagu_migration_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d icamagu_migration_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/icamagu_migration_test?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Generate Prisma client
        run: yarn prisma:generate
      - name: Generate candidate baseline SQL from current Prisma schema
        run: |
          mkdir -p migration-artifacts
          ./node_modules/.bin/prisma migrate diff --from-empty --to-schema-datamodel prisma/schema.prisma --script > migration-artifacts/20261026_candidate_baseline.sql
          test -s migration-artifacts/20261026_candidate_baseline.sql
      - name: Apply candidate baseline to disposable PostgreSQL
        run: psql "postgresql://postgres:postgres@localhost:5432/icamagu_migration_test" -v ON_ERROR_STOP=1 -f migration-artifacts/20261026_candidate_baseline.sql
      - name: Verify candidate schema has no Prisma drift
        run: yarn prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel prisma/schema.prisma --exit-code
      - name: Upload candidate baseline for review
        uses: actions/upload-artifact@v4
        with:
          name: icamagu-prisma-candidate-baseline
          path: migration-artifacts/20261026_candidate_baseline.sql
          if-no-files-found: error
          retention-days: 14

  production-smoke:
    # The source tests cannot prove the public Render deployment is responding.
    # Run this only after the build, PostgreSQL suites and migration validation
    # pass; retry briefly to allow Render's auto-deploy to finish after a push.
    needs: [test, postgres-integration, migration-baseline-validation]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify both public production health endpoints
        env:
          HEALTH_URLS: https://i-camagu.co.za/api/health https://i-camagu.onrender.com/api/health
        run: |
          for health_url in $HEALTH_URLS; do
            ready=false
            for attempt in $(seq 1 18); do
              body="$(curl --silent --show-error --max-time 15 "$health_url" || true)"
              if printf '%s' "$body" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{const r=JSON.parse(s);process.exit(r.status === 'ok' ? 0 : 1)}catch{process.exit(1)}})"; then
                echo "Production health endpoint $health_url returned status=ok."
                ready=true
                break
              fi
              echo "Production health check attempt $attempt/18 for $health_url not ready yet."
              sleep 10
            done
            if [ "$ready" != "true" ]; then
              echo "Production health endpoint $health_url did not return JSON status=ok."
              exit 1
            fi
          done

      - name: Verify canonical frontend and PWA install assets
        env:
          APP_ORIGIN: https://i-camagu.co.za
        run: |
          html="$(curl --fail --silent --show-error --max-time 15 "$APP_ORIGIN/")"
          printf '%s' "$html" | grep -q '<div id="root"></div>'
          printf '%s' "$html" | grep -q 'manifest.webmanifest'
          manifest="$(curl --fail --silent --show-error --max-time 15 "$APP_ORIGIN/manifest.webmanifest")"
          printf '%s' "$manifest" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{const m=JSON.parse(s);process.exit(m.name==='iCamagu' && m.start_url==='/' ? 0 : 1)}catch{process.exit(1)}})"
          for asset in /icons/android-chrome-192.png /icons/android-chrome-512.png /icons/maskable-512.png /icons/apple-touch-icon.png; do
            curl --fail --silent --show-error --max-time 15 -o /dev/null "$APP_ORIGIN$asset"
          done
          echo "Public frontend root, PWA manifest, and install icons respond successfully."

      - name: Audit live catalogue category and image coverage
        env:
          APP_ORIGIN: https://i-camagu.co.za
        run: |
          catalogue="$(curl --fail --silent --show-error --max-time 30 "$APP_ORIGIN/api/basket/catalogue")"
          printf '%s' "$catalogue" > /tmp/icamagu-live-catalogue.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { DEPARTMENTS, departmentOf } from './src/data/storeTaxonomy.js';

          const rows = JSON.parse(fs.readFileSync('/tmp/icamagu-live-catalogue.json', 'utf8'));
          if (!Array.isArray(rows) || rows.length === 0) {
            console.error('Live catalogue endpoint did not return a non-empty SKU array.');
            process.exit(1);
          }

          const categoryCounts = new Map();
          const departmentCounts = new Map();
          const mappedCategories = new Set(DEPARTMENTS.flatMap((department) =>
            department.aisles.flatMap((aisle) => aisle.categories.map((category) => category.trim().toUpperCase())),
          ));
          let missingCategory = 0;
          let unmappedCategory = 0;
          let missingImage = 0;
          const missingImagesByCategory = new Map();
          const missingImagesByDepartment = new Map();
          const missingImageSkus = [];

          for (const row of rows) {
            const category = String(row.category ?? '').trim().toUpperCase();
            if (!category) missingCategory += 1;
            else {
              categoryCounts.set(category, (categoryCounts.get(category) ?? 0) + 1);
              if (!mappedCategories.has(category)) unmappedCategory += 1;
            }
            const department = departmentOf(row).id;
            departmentCounts.set(department, (departmentCounts.get(department) ?? 0) + 1);
            if (!String(row.imageUrl ?? '').trim()) {
              missingImage += 1;
              const categoryKey = category || '(missing category)';
              missingImagesByCategory.set(categoryKey, (missingImagesByCategory.get(categoryKey) ?? 0) + 1);
              missingImagesByDepartment.set(department, (missingImagesByDepartment.get(department) ?? 0) + 1);
              missingImageSkus.push({
                name: String(row.name ?? '').trim() || '(unnamed SKU)',
                category: categoryKey,
                pack: String(row.bottleFormat ?? row.bulkUnit ?? '').trim() || '(unspecified pack)',
              });
            }
          }

          console.log(`Live catalogue audit: ${rows.length} SKU rows`);
          console.log('Category counts:', Object.fromEntries([...categoryCounts].sort(([a], [b]) => a.localeCompare(b))));
          console.log('Department counts:', Object.fromEntries([...departmentCounts].sort(([a], [b]) => a.localeCompare(b))));
          console.log(`Rows without category: ${missingCategory}; category codes not mapped to a named aisle: ${unmappedCategory}; rows without imageUrl: ${missingImage}`);
          console.log('Rows without imageUrl by category:', Object.fromEntries([...missingImagesByCategory].sort(([a], [b]) => a.localeCompare(b))));
          console.log('Rows without imageUrl by department:', Object.fromEntries([...missingImagesByDepartment].sort(([a], [b]) => a.localeCompare(b))));
          console.log('Missing-image review list (name | category | pack; no IDs, prices or image URLs):');
          for (const sku of missingImageSkus.sort((a, b) => a.category.localeCompare(b.category) || a.name.localeCompare(b.name))) {
            console.log(`- ${sku.name} | ${sku.category} | ${sku.pack}`);
          }
          NODE

      - name: Compare runtime configuration presence on both Render services
        env:
          CANONICAL_ENV_URL: https://i-camagu.co.za/api/health/env
          SECONDARY_ENV_URL: https://i-camagu.onrender.com/api/health/env
        run: |
          canonical="$(curl --fail --silent --show-error --max-time 15 "$CANONICAL_ENV_URL")"
          secondary="$(curl --fail --silent --show-error --max-time 15 "$SECONDARY_ENV_URL")"
          node - "$canonical" "$secondary" <<'NODE'
          const [canonical, secondary] = process.argv.slice(2).map((value) => JSON.parse(value));
          const keys = [
            'DATABASE_URL', 'JWT_ACCESS_SECRET', 'JWT_REFRESH_SECRET', 'APP_URL',
            'RESEND_API_KEY', 'EMAIL_FROM', 'SENTRY_DSN', 'ID_ENCRYPTION_KEY',
            'SUPABASE_URL', 'SUPABASE_SERVICE_ROLE_KEY', 'SUPABASE_STORAGE_BUCKET',
            'PAYFAST_MERCHANT_ID', 'PAYFAST_MERCHANT_KEY',
          ];
          console.log('Render runtime configuration presence (booleans only; no secret values):');
          for (const key of keys) {
            const a = canonical[key] === true;
            const b = secondary[key] === true;
            console.log(`${key}: canonical=${a} secondary=${b}${a !== b ? ' [DIFF]' : ''}`);
          }
          const required = ['DATABASE_URL', 'JWT_ACCESS_SECRET', 'JWT_REFRESH_SECRET'];
          const missing = required.filter((key) => canonical[key] !== true || secondary[key] !== true);
          if (missing.length) {
            console.error(`Required runtime configuration missing on one or both services: ${missing.join(', ')}`);
            process.exit(1);
          }
          NODE

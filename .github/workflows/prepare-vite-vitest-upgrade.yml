name: Prepare Vite and Vitest security upgrade candidate

on:
  push:
    branches:
      - security/upgrade-vite-vitest

permissions:
  contents: write

jobs:
  candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install current lockfile
        run: yarn install --frozen-lockfile
      - name: Upgrade Vite, Vitest and compatible plugins
        run: yarn upgrade vite@^6.4.4 vitest@^4.1.12 vite-plugin-pwa@^0.21.2 @vitejs/plugin-react@^4.3.4
      - name: Verify frozen lockfile install
        run: yarn install --frozen-lockfile
      - name: Run test suite
        run: yarn test
      - name: Build frontend and PWA
        run: yarn build
      - name: Capture dependency audit
        run: |
          set +e
          yarn audit --json > dependency-audit-vite-vitest.json 2>&1
          set -e
      - name: Push tested package and lockfile candidate branch
        run: |
          cp package.json /tmp/icamagu-vite-vitest-package.json
          cp yarn.lock /tmp/icamagu-vite-vitest-yarn.lock
          cp dependency-audit-vite-vitest.json /tmp/icamagu-vite-vitest-audit.json
          git fetch origin main
          git switch --force-create security/vite-vitest-upgrade-candidate origin/main
          cp /tmp/icamagu-vite-vitest-package.json package.json
          cp /tmp/icamagu-vite-vitest-yarn.lock yarn.lock
          cp /tmp/icamagu-vite-vitest-audit.json dependency-audit-vite-vitest.json
          git add package.json yarn.lock
          if git diff --cached --quiet; then
            echo "No dependency changes generated."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(deps): upgrade Vite and Vitest to patched releases"
          git push --force-with-lease origin HEAD:security/vite-vitest-upgrade-candidate
      - name: Upload upgrade candidate and audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: icamagu-vite-vitest-upgrade-candidate
          path: |
            package.json
            yarn.lock
            dependency-audit-vite-vitest.json
          if-no-files-found: warn
          retention-days: 7

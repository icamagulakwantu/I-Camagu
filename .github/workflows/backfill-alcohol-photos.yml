name: Backfill Alcohol Product Photos

# Manual-only — click "Run workflow" in the Actions tab (works fine from the
# GitHub mobile site or app). This is the same script described in
# server/scripts/backfill-alcohol-photos.js; it just runs here instead of a
# local machine because GitHub Actions gives every repo free compute minutes
# and, unlike the Claude session that maintains this repo, has real internet
# access to retailer sites.
on:
  workflow_dispatch:
    inputs:
      force:
        description: "Re-download and overwrite images that already exist"
        type: boolean
        default: false
      include_flagged:
        description: "Also download needsReview entries (still won't auto-apply them to the DB)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Generate Prisma client
        run: yarn prisma:generate

      - name: Run photo backfill
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          ARGS=""
          if [ "${{ inputs.force }}" = "true" ]; then ARGS="$ARGS --force"; fi
          if [ "${{ inputs.include_flagged }}" = "true" ]; then ARGS="$ARGS --include-flagged"; fi
          node server/scripts/backfill-alcohol-photos.js $ARGS

      - name: Commit and push new/changed images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/images/brands/
          if git diff --cached --quiet; then
            echo "No image changes to commit."
          else
            git commit -m "Backfill alcohol product photos (automated)"
            git push
          fi

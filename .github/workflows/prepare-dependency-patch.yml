name: Prepare targeted dependency patch candidate

on:
  push:
    branches:
      - security/patch-vulnerable-transitives

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install current lockfile
        run: yarn install --frozen-lockfile
      - name: Pin reviewed patched transitive dependency versions
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const packageJson = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          packageJson.resolutions = {
            ...packageJson.resolutions,
            'proxy-addr': '2.0.8',
            'body-parser': '1.20.9',
            'qs': '6.16.1',
            'source-map-js': '1.2.2',
            'fast-uri': '3.1.9',
            'postcss-selector-parser': '6.1.5',
          };
          fs.writeFileSync('package.json', JSON.stringify(packageJson, null, 2) + '\n');
          NODE
          yarn install --force
      - name: Verify lockfile remains installable
        run: yarn install --frozen-lockfile
      - name: Run test suite
        run: yarn test
      - name: Build frontend
        run: yarn build
      - name: Capture post-patch dependency audit
        run: |
          set +e
          yarn audit --json > dependency-audit-after.json 2>&1
          set -e
      - name: Open a PR with the tested lockfile patch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp yarn.lock /tmp/icamagu-patched-yarn.lock
          cp package.json /tmp/icamagu-patched-package.json
          cp dependency-audit-after.json /tmp/icamagu-dependency-audit-after.json
          git fetch origin main
          git switch --force-create security/transitive-dependency-patches origin/main
          cp /tmp/icamagu-patched-yarn.lock yarn.lock
          cp /tmp/icamagu-patched-package.json package.json
          cp /tmp/icamagu-dependency-audit-after.json dependency-audit-after.json
          git add package.json yarn.lock
          if git diff --cached --quiet; then
            echo "No targeted lockfile changes were produced; no PR needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(deps): patch vulnerable transitive packages"
          git push --force-with-lease origin HEAD:security/transitive-dependency-patches
          gh pr create \
            --base main \
            --head security/transitive-dependency-patches \
            --title "Patch vulnerable transitive dependencies" \
            --body "Generated by a clean GitHub Actions runner using Yarn's targeted upgrade pattern for proxy-addr, body-parser, qs, source-map-js, brace-expansion, fast-uri, postcss-selector-parser, esbuild and uuid within existing semver ranges. The candidate passed yarn install --frozen-lockfile, the test suite and the frontend build before this PR was created. Review the lockfile diff and post-patch audit artifact before merging. No direct dependency ranges or runtime code were changed."

      - name: Upload lockfile and audit output for review
        uses: actions/upload-artifact@v4
        with:
          name: icamagu-targeted-dependency-patch
          path: |
            package.json
            yarn.lock
            dependency-audit-after.json
          if-no-files-found: error
          retention-days: 7
